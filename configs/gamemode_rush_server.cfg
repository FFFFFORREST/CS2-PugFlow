// Runs after gamemode_rush.cfg on every Rush map load.
// Hold Rush's warmup (120 s, or 5 s once everyone has connected) from the moment the map loads,
// so it can't end before PugFlow runs practice.cfg. The match starts with !votestart,
// which runs rush_live.cfg.
mp_warmup_pausetimer 1
mp_warmuptime_all_players_connected 0
