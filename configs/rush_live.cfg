// Live Rush match (PugFlow, Rush maps only); reset from free warmup to Rush rules.
// gamemode_rush.cfg restores Rush's own economy, round times and respawn rules; the lines
// after it undo the practice.cfg settings that gamemode_rush.cfg doesn't touch.
exec gamemode_rush.cfg
bot_quota 0
bot_kick
mp_warmup_pausetimer 0
mp_warmup_items_nocost 0
mp_weapons_allow_typecount 5
mp_free_armor 0
mp_give_player_c4 1
mp_drop_knife_enable 1
mp_autoteambalance 0
mp_limitteams 0
// Friendly fire off (set mp_friendlyfire 1 to enable).
mp_friendlyfire 0
mp_teammates_are_enemies 0
mp_warmup_end
mp_restartgame 1
